name: Build Standalone APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      # NOTE: running `flutter create --overwrite` on every build is fragile.
      # Long term, run it once locally and commit the generated android/ folder.
      - name: Backup custom project files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp analysis_options.yaml /tmp/analysis_options.yaml
          cp -r lib /tmp/lib_backup
          cp -r test /tmp/test_backup
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml

      - name: Scaffold Android platform files
        run: flutter create . --project-name wifi_guardian_app --org com.example --platforms=android --overwrite

      - name: Restore custom project files
        run: |
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/analysis_options.yaml analysis_options.yaml
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          cp -r /tmp/test_backup test
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      # Fails the build on compile errors; lint infos/warnings are reported only.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Read app version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Release
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Wi-Fi-Security-Guardian-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Fi-Security-Guardian-APK
          path: build/app/outputs/flutter-apk/Wi-Fi-Security-Guardian-v${{ steps.version.outputs.version }}.apk

      # The release tag now follows `version:` in pubspec.yaml, so each new
      # version gets its own release instead of overwriting v1.0.0.
      - name: Auto Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Wi-Fi Security Guardian v${{ steps.version.outputs.version }}"
          body: |
            ## 🛡️ Wi-Fi Security Guardian v${{ steps.version.outputs.version }}
            
            Standalone local network security assessment mobile application for Android.
            
            ### 🎓 Key Academic & Technical Capabilities:
            - **5-Tier Qualitative Risk Classification** (Excellent, Good, Fair, Poor, Critical)
            - **18 Curated IoT Vulnerabilities with Clear Fix Steps**
            - **Anomaly Detection (Isolation Forest + expert rules)**
            - **Academic Testbed Demo Mode** (Safe demonstration on any network)
            - **Standalone HTML & Markdown Audit Reports**
            
            ### 📱 Download & Install:
            Click `Wi-Fi-Security-Guardian-v${{ steps.version.outputs.version }}.apk` below to download and install directly on any Android phone or 64-bit emulator.
          files: build/app/outputs/flutter-apk/Wi-Fi-Security-Guardian-v${{ steps.version.outputs.version }}.apk
