name: Build Standalone APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Backup custom project files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_backup
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml

      - name: Scaffold Android platform files
        run: flutter create . --project-name wifi_guardian_app --org com.example --platforms=android --overwrite

      - name: Restore custom project files
        run: |
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Release
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Wi-Fi-Security-Guardian-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Fi-Security-Guardian-APK
          path: build/app/outputs/flutter-apk/Wi-Fi-Security-Guardian-v1.0.0.apk

      - name: Auto Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Wi-Fi Security Guardian v1.0.0 (Release)"
          body: |
            ## 🛡️ Wi-Fi Security Guardian v1.0.0
            
            Standalone local network security assessment mobile application for Android.
            
            ### 🎓 Key Academic & Technical Capabilities:
            - **5-Tier Qualitative Risk Classification** (Excellent, Good, Fair, Poor, Critical)
            - **18 Curated IoT Vulnerabilities with Clear Fix Steps**
            - **Unsupervised Behavioral Anomaly Detection**
            - **Academic Testbed Demo Mode** (Safe demonstration on any network)
            - **Standalone HTML & Markdown Audit Reports**
            
            ### 📱 Download & Install:
            Click `Wi-Fi-Security-Guardian-v1.0.0.apk` below to download and install directly on any Android phone or 64-bit emulator.
          files: build/app/outputs/flutter-apk/Wi-Fi-Security-Guardian-v1.0.0.apk
