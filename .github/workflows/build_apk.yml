name: Build Standalone APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Optional release signing (see docs/release-signing.md). Without these
      # secrets the APK is signed with a temporary debug key.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      # Without --overwrite, flutter create only adds the missing android/
      # files and keeps lib/, test/, pubspec.yaml and the custom
      # AndroidManifest.xml. The generated sample test is removed.
      - name: Scaffold Android platform files
        run: |
          flutter create . --project-name wifi_guardian_app --org com.iv4n666 --platforms=android
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons -f launcher_icons_android.yaml

      # Fails the build on compile errors; lint infos/warnings are reported only.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Read app version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
          python3 tool/ci/configure_android_signing.py android/app/build.gradle

      - name: Warn when release signing is not configured
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::Release signing secrets are not set. The APK is signed with a temporary debug key, so people must uninstall the old version before installing a new one. See docs/release-signing.md"

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Release
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Wi-Fi-Security-Guardian-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Fi-Security-Guardian-APK
          path: build/app/outputs/flutter-apk/Wi-Fi-Security-Guardian-v${{ steps.version.outputs.version }}.apk

      # The release tag follows `version:` in pubspec.yaml.
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Wi-Fi Security Guardian v${{ steps.version.outputs.version }}"
          body: |
            ## Wi-Fi Security Guardian v${{ steps.version.outputs.version }}

            Checks the devices on your home Wi-Fi for risky services and explains how to fix them in plain English. Works on Android phones and Windows PCs. Nothing is uploaded: all results stay on your device.

            ### Android
            1. Download `Wi-Fi-Security-Guardian-v${{ steps.version.outputs.version }}.apk` below on your phone.
            2. Open it and allow "Install unknown apps" for your browser or file manager when asked.
            3. Connect to your Wi-Fi and tap Scan.

            ### Windows
            1. Download `Wi-Fi-Security-Guardian-Windows-v${{ steps.version.outputs.version }}.zip` below and extract the whole folder.
            2. Run `WiFiSecurityGuardian.exe`. If SmartScreen appears, click More info → Run anyway (the app is not code-signed).
            3. If Windows Firewall asks, allow access on Private networks.

            Only scan networks you own or have permission to test.

            How the score works: see docs/scoring-method.md in the repository.
          files: build/app/outputs/flutter-apk/Wi-Fi-Security-Guardian-v${{ steps.version.outputs.version }}.apk

  # Windows (PC) version of the same app. Runs only after the Android job
  # has passed analysis and unit tests.
  build-windows:
    needs: build
    # Pinned to windows-2022: `windows-latest` now ships Visual Studio 2026,
    # which Flutter 3.22 does not recognise (it falls back to the VS 2019
    # generator and fails). windows-2022 has Visual Studio 2022.
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      # Without --overwrite, flutter create only adds the missing windows/
      # folder and never touches lib/, pubspec.yaml or the tests.
      # The window title and .exe name are then made user-friendly.
      - name: Scaffold Windows platform files
        shell: pwsh
        run: |
          flutter create . --project-name wifi_guardian_app --org com.iv4n666 --platforms=windows
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }
          (Get-Content windows/runner/main.cpp) -replace 'L"wifi_guardian_app"', 'L"Wi-Fi Security Guardian"' | Set-Content windows/runner/main.cpp
          (Get-Content windows/CMakeLists.txt) -replace 'set\(BINARY_NAME "wifi_guardian_app"\)', 'set(BINARY_NAME "WiFiSecurityGuardian")' | Set-Content windows/CMakeLists.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons -f launcher_icons_windows.yaml

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          Copy-Item docs/WINDOWS_README.txt build/windows/x64/runner/Release/README.txt
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Wi-Fi-Security-Guardian-Windows-v${{ needs.build.outputs.version }}.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Fi-Security-Guardian-Windows
          path: Wi-Fi-Security-Guardian-Windows-v${{ needs.build.outputs.version }}.zip

      - name: Add Windows zip to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: "Wi-Fi Security Guardian v${{ needs.build.outputs.version }}"
          files: Wi-Fi-Security-Guardian-Windows-v${{ needs.build.outputs.version }}.zip
